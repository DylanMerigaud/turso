name: Build & publish @tursodatabase/sync-react-native
'on':
  push:
    branches:
    - ci/fix/drop-and-fk-missing-column
  workflow_dispatch: null
env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: 10
  working-directory: bindings/react-native
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-ios:
    name: Build iOS libraries
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios,aarch64-apple-ios-sim
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-rust-ios
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Use a faster build profile on pull requests
      if: github.event_name == 'pull_request'
      run: echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"
    - name: Build iOS libraries
      run: make ios-build
      working-directory: ${{ env.working-directory }}
    - name: Package iOS xcframework
      run: make package-dylibs
      working-directory: ${{ env.working-directory }}
    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-libs
        path: 'bindings/react-native/libs/ios/

          '
        if-no-files-found: error
  build-android:
    name: Build Android libraries (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: aarch64-linux-android
          abi: arm64-v8a
        - target: armv7-linux-androideabi
          abi: armeabi-v7a
        - target: x86_64-linux-android
          abi: x86_64
        - target: i686-linux-android
          abi: x86
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-rust-android
        key: ${{ matrix.target }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Set up Android NDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    - name: Use a faster build profile on pull requests
      if: github.event_name == 'pull_request'
      run: echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"
    - name: Build Android library
      run: make android-arch TARGET=${{ matrix.target }} ABI=${{ matrix.abi }}
      working-directory: ${{ env.working-directory }}
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-libs-${{ matrix.abi }}
        path: 'bindings/react-native/libs/android/

          '
        if-no-files-found: error
  build-typescript:
    name: Build TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Install dependencies
      run: npm install
      working-directory: ${{ env.working-directory }}
    - name: Build TypeScript
      run: npm run build
      working-directory: ${{ env.working-directory }}
    - name: Type check
      run: npm run typescript
      working-directory: ${{ env.working-directory }}
    - name: Upload TypeScript build
      uses: actions/upload-artifact@v4
      with:
        name: typescript-build
        path: 'bindings/react-native/lib/

          '
        if-no-files-found: error
  build-example-ios:
    name: Build example app (iOS)
    runs-on: macos-latest
    timeout-minutes: 45
    needs:
    - build-ios
    - build-typescript
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: examples/react-native
    - name: Download iOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: ios-libs
        path: bindings/react-native/libs/ios/
    - name: Fix xcframework after artifact download
      run: "find bindings/react-native/libs/ios/turso-sync-sdk-kit.xcframework \\\n  -name \"turso-sync-sdk-kit\" -type f | while read f; do\n  chmod +x \"$f\"\n  codesign -f -s - \"$f\"\ndone\n"
    - name: Download TypeScript build
      uses: actions/download-artifact@v4
      with:
        name: typescript-build
        path: bindings/react-native/lib/
    - name: Install binding dependencies
      run: npm install
      working-directory: ${{ env.working-directory }}
    - name: Install example app dependencies
      run: npm install
      working-directory: examples/react-native
    - name: Install CocoaPods dependencies
      run: bundle exec pod install
      working-directory: examples/react-native/ios
    - name: Verify xcframework
      run: 'ls -la bindings/react-native/libs/ios/turso-sync-sdk-kit.xcframework/ios-arm64-simulator/turso-sync-sdk-kit.framework/

        file bindings/react-native/libs/ios/turso-sync-sdk-kit.xcframework/ios-arm64-simulator/turso-sync-sdk-kit.framework/turso-sync-sdk-kit

        '
    - name: Build iOS example app
      run: "xcodebuild build \\\n  -workspace TursoExample.xcworkspace \\\n  -scheme TursoExample \\\n  -sdk iphonesimulator \\\n  -destination 'generic/platform=iOS Simulator' \\\n  -configuration Debug \\\n  CODE_SIGNING_ALLOWED=NO \\\n  ARCHS=arm64 \\\n  ONLY_ACTIVE_ARCH=YES\n"
      working-directory: examples/react-native/ios
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
    - build-ios
    - build-android
    - build-typescript
    - build-example-ios
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Update npm
      run: npm install -g npm@11
    - name: Download iOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: ios-libs
        path: bindings/react-native/libs/ios/
    - name: Download Android artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: android-libs-*
        merge-multiple: true
        path: bindings/react-native/libs/android/
    - name: Download TypeScript build
      uses: actions/download-artifact@v4
      with:
        name: typescript-build
        path: bindings/react-native/lib/
    - name: Install dependencies
      run: npm install
      working-directory: ${{ env.working-directory }}
    - name: List package contents
      run: 'echo "=== Package contents ==="

        ls -la

        echo "=== libs/ios ==="

        ls -laR libs/ios/ || echo "No iOS libs"

        echo "=== libs/android ==="

        ls -laR libs/android/ || echo "No Android libs"

        echo "=== lib (TypeScript) ==="

        ls -laR lib/ || echo "No lib"

        '
      working-directory: ${{ env.working-directory }}
    - name: Publish
      if: startsWith(github.ref, 'refs/tags/v')
      run: "if git log -1 --pretty=%B | grep \"^Turso [0-9]\\+\\.[0-9]\\+\\.[0-9]\\+$\";\nthen\n  npm publish --access public --provenance\nelif git log -1 --pretty=%B | grep \"^Turso [0-9]\\+\\.[0-9]\\+\\.[0-9]\\+\";\nthen\n  npm publish --access public --provenance --tag next\nelse\n  echo \"git log structure is unexpected, skip publishing\"\n  npm publish --dry-run\nfi\n"
      working-directory: ${{ env.working-directory }}
    - name: Publish (dry-run)
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: npm pack
      working-directory: ${{ env.working-directory }}
    - name: Upload package tarball
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      uses: actions/upload-artifact@v4
      with:
        name: npm-package
        path: bindings/react-native/*.tgz
